name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check for unresolved merge-conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )'; then
            echo "Unresolved merge-conflict markers found in tracked files."
            exit 1
          fi
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install project and audit tools
        run: python -m pip install -e . pip-audit bandit
      - name: Audit Python dependencies
        run: python -m pip_audit --strict -r requirements.txt
      - name: Run Bandit static analysis
        run: python -m bandit -r jiosaavn.py jiosaavn_core.py
